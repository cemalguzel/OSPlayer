name: macOS DMG üret
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  dmg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: MPV bağımlılığını hazırla
        run: brew install mpv
      - name: DMG derle
        run: bash scripts/build-platform.sh
      - name: macOS çökme raporlarını sakla
        if: failure()
        shell: bash
        run: |
          mkdir -p diagnostics
          report_dir="$HOME/Library/Logs/DiagnosticReports"
          for attempt in {1..10}; do
            if [ -d "$report_dir" ]; then
              find "$report_dir" -maxdepth 1 -type f \( -name '*Electron*.ips' -o -name '*Electron*.crash' \) -mmin -15 -exec cp {} diagnostics/ \;
            fi
            if [ -n "$(ls -A diagnostics)" ]; then break; fi
            sleep 2
          done
          if [ -z "$(ls -A diagnostics)" ]; then
            echo 'macOS çökme raporu üretmedi; derleme günlüğündeki son test aşamasını inceleyin.' > diagnostics/RAPOR_YOK.txt
          fi
      - name: Çökme kanıtlarını yükle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mpv-tani-${{ matrix.arch }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 7
      - name: Özet oluştur
        run: shasum -a 256 release/*.dmg > release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: osplayer-macos-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
